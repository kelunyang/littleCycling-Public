<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>littleCycling</title>
    <!-- Import map：讓 esm.sh 上的 md-editor-v3（?external=vue）把 `import "vue"`
         導向本地 shim，共用 app 打包的同一份 Vue 實例（兩份 Vue 會壞 reactivity）。
         Vite 會把 app 自己的 vue import 改寫掉，此 map 只會被 CDN 模組用到。 -->
    <script type="importmap">{ "imports": { "vue": "/vue-cdn-shim.mjs" } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Noto Sans TC：全主題共用的 CJK fallback。拉丁 display 字型不含中文字符，
         沒有它中文會落到 generic family（cursive 在 Windows 映射到標楷體）。 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Cabin+Sketch:wght@400;700&family=Patrick+Hand&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
